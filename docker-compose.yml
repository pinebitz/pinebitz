services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pinebitz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pinebitz}
      POSTGRES_DB: ${POSTGRES_DB:-pinebitz}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pinebitz} -d ${POSTGRES_DB:-pinebitz}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pinebitz_pg:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${API_HOST_PORT:-18000}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pinebitz}:${POSTGRES_PASSWORD:-pinebitz}@postgres:5432/${POSTGRES_DB:-pinebitz}
      METRICS_PROM_ENABLED: "${METRICS_PROM_ENABLED:-true}"
      METRICS_PROM_AUTH_MODE: ${METRICS_PROM_AUTH_MODE:-token}
      METRICS_PROM_TOKEN: ${METRICS_PROM_TOKEN:-change-me}
      METRICS_PROM_ALLOWLIST: ${METRICS_PROM_ALLOWLIST:-0.0.0.0/0}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      retries: 12

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-19090}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  pinebitz_pg: {}
