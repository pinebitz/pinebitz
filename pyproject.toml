[project]
name = "pinebitz"
version = "0.3.0"
description = "DCA / exchange tooling — Binance USD-M testnet scaffolding"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.4.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pinebitz*"]

